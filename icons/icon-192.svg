<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" role="img" aria-label="Blossom Gardens icon">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffe6f2"/>
      <stop offset="45%" stop-color="#ffb3d9"/>
      <stop offset="100%" stop-color="#b19cd9"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff69b4"/>
      <stop offset="100%" stop-color="#e91e63"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="192" height="192" rx="40" fill="url(#bg)"/>

  <!-- simple flower mark -->
  <g transform="translate(96 96)">
    <circle r="18" fill="#ffd700" opacity="0.95"/>
    <g fill="url(#petal)">
      <ellipse rx="20" ry="40" transform="rotate(0) translate(0,-44)"/>
      <ellipse rx="20" ry="40" transform="rotate(60) translate(0,-44)"/>
      <ellipse rx="20" ry="40" transform="rotate(120) translate(0,-44)"/>
      <ellipse rx="20" ry="40" transform="rotate(180) translate(0,-44)"/>
      <ellipse rx="20" ry="40" transform="rotate(240) translate(0,-44)"/>
      <ellipse rx="20" ry="40" transform="rotate(300) translate(0,-44)"/>
    </g>
    <circle r="12" fill="#fff4cc" opacity="0.95"/>
  </g>

  <!-- subtle monogram -->
  <text x="96" y="168" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="rgba(0,0,0,0.28)">
    BG
  </text>
</svg>
